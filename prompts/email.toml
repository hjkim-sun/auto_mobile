# Jev 판별 프롬프트: 메일 (events.source = email)
# 형식은 app/services/prompts.py 참고. 판별할 때마다 읽으므로 고친 뒤 재시작하지 않아도 된다.

# questions.<keep_question> 의 <keep_choice> 확률이 threshold 이상이면 kept, 아니면 discarded
keep_question = "relevance"
keep_choice = "useful"
# threshold = 0.3   # 생략하면 .env 의 JEV_KEEP_THRESHOLD

[questions.relevance]
type = "choice"
instructions = """받은편지함에 들어온 메일, 또는 사용자가 보낸 메일(첫 줄에 "보낸메일함" 표시) 한 통이다. 사용자가 직접 읽거나 알아야 하는 메일인가?
대량 발송된 자동 메일이라도 사용자의 돈·계정·일정에 직접 영향을 주면 useful 이다.
사용자가 직접 써서 보낸 메일은 사용자의 일·약속·관계를 보여 주므로 useful 이다."""

[questions.relevance.criteria]
useful = "사람이 직접 보낸 업무·개인 메일, 회신이나 조치를 요청하는 메일, 회의·일정 초대, 결제·청구·환불·계약·세금 안내, 예약·배송 확인, 새 기기 로그인·비밀번호 변경 같은 계정 보안 알림, 마감이 있는 기관·학교·금융사 안내"
noise = "광고·프로모션·할인 쿠폰, 뉴스레터, 웨비나·행사 홍보, 이용약관·개인정보처리방침 개정 같은 전체 공지, SNS·커뮤니티 활동 알림, 인증번호, 설문 요청"
