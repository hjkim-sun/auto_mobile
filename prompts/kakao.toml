# Jev 판별 프롬프트: 카카오톡 방 단위 판단 (app/services/kakao_judge.py)
# 방의 최근 대화 20건을 주고 ▶ 표시한 새 메시지만 판단한다. 맥 동기화로 들어온 것도, 폰 알림으로 들어온 것도 같다.
# 방을 알 수 없는 폰 알림(group/unassigned.csv)은 메시지 하나만 주고 같은 질문으로 판별한다.
# 형식은 app/services/prompts.py 참고. 판별할 때마다 읽으므로 고친 뒤 재시작하지 않아도 된다.
# useful 이면 Claude 가 한 번 더 보고 캘린더 등록 여부를 정한다 (prompts/kakao_judge.md).

# questions.<keep_question> 의 <keep_choice> 확률이 threshold 이상이면 Claude 로 넘긴다
keep_question = "relevance"
keep_choice = "useful"
# threshold = 0.3   # 생략하면 .env 의 JEV_KEEP_THRESHOLD

[questions.relevance]
type = "choice"
instructions = "▶ 표시한 새 메시지(표시가 없으면 메시지 전체)에 개인비서가 챙겨야 할 내용이 있는가? 앞 대화는 맥락으로만 본다."

[questions.relevance.criteria]
useful = "약속·일정·모임 날짜나 시간을 정하거나 바꾸거나 취소하는 말, 예약 확인, 마감·제출 기한, 주인에게 답이나 행동을 요청하는 말, 가족·지인의 중요한 소식, 업무 연락"
noise = "인사·잡담·리액션·이모티콘·사진만 보낸 것, 이미 정해진 일을 되풀이하는 맞장구, 광고·홍보, 단순 정보 공유처럼 주인이 할 일이 없는 대화"
